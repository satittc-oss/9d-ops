/* Nine Distribution CI — supplied original-logo board, October 2026.
   Keep the logo asset intact. UI colors and type follow the board's palette. */
:root {
  --brand-blue: #284397;
  --brand-grey: #686666;
  --brand-navy: #122349;
  --brand-accent: #4ca8d8;
  --brand-ice: #f5f7fb;
  --brand-soft: #edf1fa;
  --brand-border: #dce3f0;
  --brand-slate: #53617d;
  --navy: var(--brand-navy);
  --navy-deep: #0d1b3b;
  --ink: var(--brand-navy);
  --muted: #66728a;
  --line: #e0e5ef;
  --mint: var(--brand-soft);
  --green: var(--brand-blue);
  --bg: var(--brand-ice);
  --blue: var(--brand-blue);
  --orange: #94652a;
  --purple: #586b99;
  --status-success: #23704f;
  --status-warning: #855c1e;
  --status-danger: #a53e3e;
}

body { font-family: Inter, 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, 'Leelawadee UI', Tahoma, sans-serif; }
h1, h2, h3 { color: var(--brand-navy); }
::selection { background: #dce5ff; color: var(--brand-navy); }
button:focus-visible, a:focus-visible { outline-color: var(--brand-blue); }
input:focus, textarea:focus, select:focus { outline-color: #b4c3e8; border-color: var(--brand-blue); }
.muted { color: var(--muted); }
.late { color: var(--status-danger) !important; }
.green-text { color: var(--status-success); }
.eyebrow, .heading-overline { color: var(--brand-blue); }
.tiny-square, .blue-dot { background: var(--brand-blue); }

/* Exact company mark with alpha transparency; reverse it on the navy sidebar. */
.sidebar { background: var(--brand-navy); color: #c7d1e6; padding-top: 23px; overflow-y: auto; }
.brand { display: block; position: relative; padding: 0 0 23px; }
.brand-logo-frame { display: flex; align-items: center; justify-content: center; min-height: 107px; padding: 12px 18px; background: transparent; border: 0; border-radius: 0; }
.brand-logo { width: 144px; max-width: 100%; height: auto; display: block; filter: brightness(0) invert(1); }
.brand-caption { display: flex; flex-direction: column; gap: 5px; margin: 13px 3px 0; }
.brand-caption strong { font-size: 9px; font-weight: 600; letter-spacing: 1.15px; color: #fff; }
.brand-caption span { color: #b4c5e7; font-size: 10px; letter-spacing: .1px; }
.workspace-mark { background: #ffffff06; border-color: #ffffff1c; color: #c7d1e6; border-radius: 4px; margin-bottom: 23px; }
.mint-dot { background: var(--brand-accent); }
.nav-label { color: #a4b4d7; }
.nav-item, .nav-item svg { color: #bdc9e2; }
.nav-item { border-radius: 4px; }
.nav-item:hover { background: #ffffff0c; color: #fff; }
.nav-item.active { color: #fff; background: var(--brand-blue); box-shadow: inset 3px 0 0 var(--brand-accent); }
.nav-item.active svg { color: #fff; }
.nav-item.active b { color: #fff; background: #ffffff24; }
.nav-item b { background: #ffffff12; }
.nav-ping { background: var(--brand-accent); }
.connection-dot { background: #d7b36e; }
.connection-dot.connected { background: #85c5a5; }
.sidebar-divider, .sidebar-user { border-color: #ffffff16; }
.sidebar-bottom { padding-top: 32px; }
.security-note { background: #0d1b3b; border-color: #ffffff14; border-radius: 4px; }
.security-note svg, .security-note strong { color: #c2d2f2; }
.security-note p, .sidebar-user small { color: #a2b3d2; }
.sidebar-user strong { color: #fff; }
.owner-avatar { background: var(--brand-blue); color: #fff; border-radius: 5px; }
.topbar { background: #fff; border-top: 3px solid var(--brand-blue); }
.breadcrumb, .today, .global-search { color: var(--muted); }
.breadcrumb strong { color: var(--brand-slate); }
.global-search input { color: var(--brand-navy); }
.global-search input::placeholder { color: #768199; }
.global-search kbd { background: var(--brand-ice); border-color: var(--line); color: #66728a; }
.icon-button { color: #66728a; border-radius: 4px; }
.icon-button:hover { background: var(--brand-soft); color: var(--brand-blue); }
.notification i { background: var(--brand-blue); }
.topbar-avatar { background: var(--brand-soft); color: var(--brand-blue); border-color: #f5f7fb; }
.page-heading > div:first-child { border-left: 3px solid var(--brand-blue); padding-left: 14px; }
.page-heading h1 { color: var(--brand-navy); font-weight: 700; }
.page-heading p { color: #66728a; }
.heading-overline { letter-spacing: 1.3px; }
.primary, .secondary { border-radius: 4px; }
.primary { background: var(--brand-blue); border-color: var(--brand-blue); color: #fff; box-shadow: 0 2px 4px #1223490a; }
.primary:hover { background: #203679; border-color: #203679; }
.secondary { color: var(--brand-slate); border-color: #d4ddec; background: #fff; }
.secondary:hover { color: var(--brand-blue); background: var(--brand-ice); border-color: #acbde2; }
.dataset-switch { background: #e9edf5; border-radius: 4px; }
.dataset-switch button { color: var(--muted); border-radius: 3px; }
.dataset-switch button.active { background: #fff; color: var(--brand-blue); box-shadow: 0 1px 4px #1223490a; }
.system-status { color: var(--muted); }
.system-status button, .sample-note button { color: var(--brand-blue); }
.sample-note, .sample-note svg { color: #66728a; }

/* Modular white cards, precise frames, and vertical blue accents. */
.panel, .stat-card, .completion-card, .focus-card, .followup-summary > div, .team-banner, .integration-hero, .settings-profile { border-radius: 5px; border-color: var(--brand-border); }
.stat-card { background: #fff; border-top: 3px solid var(--brand-blue); box-shadow: 0 2px 5px #12234903; }
.stat-card:hover { box-shadow: 0 6px 18px #1223490b; }
.stat-label, .stat-foot, .stat-card > strong small { color: #596681; }
.stat-label svg { color: var(--brand-blue); }
.stat-card > strong { color: var(--brand-navy); font-weight: 600; font-variant-numeric: tabular-nums; }
.stat-foot { border-color: #dce3f0; }
.mint { background: var(--brand-soft) !important; }
.peach { background: #f7f8fb !important; }
.lavender { background: #fff !important; }
.stat-card.mint, .stat-card.peach, .stat-card.lavender { border-color: var(--brand-border); }
.stat-card.mint { border-top-color: var(--brand-blue); }
.stat-card.peach { border-top-color: var(--brand-grey); }
.stat-card.lavender { border-top-color: var(--brand-accent); }
.stat-card.mint .stat-label svg, .stat-card.peach .stat-label svg { color: var(--brand-blue); }
.stat-card.lavender .stat-label svg { color: var(--status-danger); }
.stat-card:first-child { background: var(--brand-navy); border-color: var(--brand-navy); border-top-color: var(--brand-blue); }
.stat-card:first-child > strong, .stat-card:first-child .stat-label { color: #fff; }
.stat-card:first-child .stat-label svg { color: #a8c3ee; }
.stat-card:first-child > strong small, .stat-card:first-child .stat-foot, .stat-card:first-child .green-text { color: #c5d2ee; }
.stat-card:first-child .stat-foot { border-color: #ffffff25; }
.focus-card { background: var(--brand-navy); border-color: var(--brand-navy); border-left: 5px solid var(--brand-blue); }
.focus-copy .eyebrow { color: #b8caec; }
.focus-copy h2 { color: #fff; }
.focus-copy em { color: #9fcbed; }
.focus-copy p { color: #c3cfe8; }
.focus-copy button { color: #fff; border-color: #89a1d25c; }
.flow-step { color: #b6c9ee; border-color: #879dc9; background: #1b315e; }
.flow-step span { color: #c3d0eb; }
.flow-step.current { background: var(--brand-blue); color: #fff; border-color: #8ca8e4; box-shadow: 0 0 0 7px #ffffff0e; }
.flow-step.current span { color: #fff; }
.flow-step.future { background: transparent; color: #b8c8e4; border-color: #7187ae; }
.flow-line { background: #687ea9; }
.flow-line.active { background: #9bb8ec; }
.flow-caption { color: #acbddd; }
.flow-caption i { background: var(--brand-accent); }
.completion-card .section-top, .completion-card .section-top svg { color: var(--brand-blue); }
.delivery-number > strong { color: var(--brand-navy); font-weight: 600; }
.delivery-number > span { color: var(--muted); }
.delivery-number b { color: var(--brand-blue); }
.delivery-track, .workload-track { background: #e8edf7; }
.delivery-track span, .workload-track span { background: var(--brand-blue); }
.text-button, .activity-item button, .guide-step a { color: var(--brand-blue); }
.text-button:hover { color: #1d3070; }
.panel-heading h2 { color: var(--brand-navy); font-weight: 650; }
.panel-heading .eyebrow { color: var(--brand-blue); }
.soft-count { color: var(--brand-blue); border-color: var(--brand-border); background: var(--brand-ice); }
.toolbar { background: #fff; border-top-color: #edf0f7; }
.filter-tabs button { color: #66728a; }
.filter-tabs button.selected { background: var(--brand-soft); color: var(--brand-blue); }
.filter-tabs button span { border-color: #d5def0; color: var(--brand-blue); }
.filter-tabs button span.red { background: #fbefef; color: var(--status-danger); border-color: #f0d9d9; }
.toolbar select { color: var(--brand-slate); }
.view-toggle { background: var(--brand-ice); border-color: var(--brand-border); }
.view-toggle button.active { color: var(--brand-blue); box-shadow: 0 1px 3px #12234915; }
.account-heading { background: var(--brand-ice); }
.account-heading:hover { background: #edf1fa; }
.account-title strong { color: var(--brand-navy); }
.account-title small, .account-summary { color: #66728a; }
.late-count { color: var(--status-danger); border-color: var(--brand-border); }
.avatar.blue { background: #e7edfb; color: var(--brand-blue); }
.avatar.purple { background: #e9edf7; color: #465e96; }
.avatar.teal { background: #e8f2fa; color: #296c97; }
.avatar.orange { background: #efefef; color: var(--brand-grey); }
.projects-table th { color: var(--brand-slate); background: #fff; border-color: #edf0f7; }
.projects-table td { border-color: #edf0f7; }
.projects-table tbody tr:hover { background: #f8faff; }
.project-code { color: var(--brand-blue); }
.project-name strong, .kanban-card > strong { color: var(--brand-navy); }
.project-name small, .kanban-card > small { color: #66728a; }
.urgent-dot { background: var(--status-danger); }
.engineer-inline, .wait-person, .next-action, .due { color: var(--brand-slate); }
.mini-avatar { background: #edf1fa; color: var(--brand-blue); }
.still-open { color: var(--brand-blue); }
.row-open { color: #7185af; }
.table-scroll { scrollbar-color: #c5cee3 transparent; }

/* Status colors retain their operational meaning inside the corporate shell. */
.badge.blue { background: #eaf0ff; color: #284397; }
.badge.amber { background: #faf3e5; color: var(--status-warning); }
.badge.orange { background: #fcf0e5; color: #8a552b; }
.badge.purple { background: #eeedfa; color: #62508f; }
.badge.teal, .badge.green { background: #eaf5ef; color: var(--status-success); }
.badge.slate { background: #eff1f5; color: #5c667d; }
.badge.red { background: #fbefef; color: var(--status-danger); }
.attention-card { background: var(--brand-navy); border: 1px solid var(--brand-navy); border-top: 3px solid var(--brand-blue); border-radius: 5px; }
.attention-card h3 { color: #fff; }
.attention-card .eyebrow, .attention-item small { color: #beccea; }
.attention-icon { background: #284397; color: #fff; }
.attention-count { color: #dce7ff; border-color: #ffffff28; background: #ffffff0a; }
.attention-item { border-color: #ffffff15; }
.attention-item strong { color: #e7edfa; }
.attention-item em { color: #d8b985; }
.attention-item > svg, .attention-footer { color: #b6ccef; }
.attention-item-dot { background: var(--brand-accent); }
.green-indicator { background: var(--brand-accent); box-shadow: 0 0 0 3px var(--brand-soft); }
.activity-point, .point-1, .point-2 { background: #6b83bf; box-shadow: 0 0 0 3px var(--brand-ice); }
.activity-item::before { background: var(--brand-border); }
.activity-item strong, .activity-item span:not(.activity-point) { color: #596681; }
.activity-item small, .small-security p { color: #66728a; }
.small-security svg, .small-security strong { color: var(--brand-blue); }
.page-footer { border-top: 1px solid var(--brand-border); margin-top: 28px; padding-top: 18px; color: #66728a; }
.page-footer i, .footer-dot { background: var(--brand-blue); }
.board { background: var(--brand-ice); }
.board-col > h3 { color: var(--brand-slate); }
.board-col > h3 > span { background: var(--brand-soft); color: var(--brand-blue); }
.dot-1, .dot-2 { background: var(--brand-blue); }
.kanban-card { border-color: var(--brand-border); border-radius: 4px; box-shadow: 0 2px 3px #12234904; }
.kanban-card:hover { border-color: #a4b5da; box-shadow: 0 4px 12px #1223490b; }
.kanban-bottom { border-color: #edf0f7; }
.kanban-bottom > span { color: var(--muted); }
.approval-symbol { background: var(--brand-soft); color: var(--brand-blue); border-radius: 5px; }
.priority { color: var(--muted); background: #f0f2f7; }
.priority.urgent { color: var(--status-danger); background: #fbefef; }
.priority.high { color: var(--status-warning); background: #faf3e5; }
.approval-content > p, .approval-meta > span { color: var(--brand-slate); }
.subtle-chip { color: var(--brand-blue); background: var(--brand-ice); border-color: var(--brand-border); border-radius: 4px; }
.followup-summary strong { color: var(--brand-navy); }
.followup-summary > div > span:last-child, .followup-date, .followup-date small, .followup-main p, .waiting-tag small { color: var(--brand-slate); }
.circle-icon { color: var(--brand-blue); border-radius: 5px; }
.waiting-tag strong { color: var(--brand-blue); }
.followup-row { border-color: #e7ecf5; }
.team-banner { background: var(--brand-navy); border-left: 5px solid var(--brand-blue); }
.team-banner h2 { color: #fff; }
.team-banner .eyebrow, .team-banner p:last-child { color: #c3cfe8; }
.stacked-avatars .avatar { border-color: var(--brand-navy); }
.engineer-card h2, .engineer-metrics strong { color: var(--brand-navy); }
.engineer-email, .engineer-metrics small, .engineer-projects small { color: var(--muted); }
.engineer-projects strong { color: var(--brand-slate); }
.engineer-projects > button { border-color: #e7ecf5; }
.engineer-projects svg { color: var(--brand-blue); }
.integration-hero { background: var(--brand-soft); border-left: 5px solid var(--brand-blue); }
.integration-hero p:last-child { color: var(--brand-slate); }
.integration-mark { color: #7890bf; }
.ops-square { display: flex; align-items: center; background: transparent; border: 0; padding: 0; width: 64px; height: 50px; }
.ops-square img { display: block; width: 100%; height: auto; }
.ms-square i { background: #284397; }
.ms-square i:nth-child(2) { background: #686666; }
.ms-square i:nth-child(3) { background: #4ca8d8; }
.ms-square i:nth-child(4) { background: #7185af; }
.integration-card .eyebrow, .integration-card > p:last-of-type, .readiness-row strong, .readiness-row p, .config-panel label { color: var(--brand-slate); }
.integration-card .status-outline { color: var(--muted); }
.readiness-row { border-color: #e7ecf5; }
.readiness-row > span { color: var(--brand-blue); background: var(--brand-soft); border-radius: 4px; }
.inline-note, .permissions-summary { background: var(--brand-soft); border-color: var(--brand-border); color: var(--brand-slate); border-radius: 4px; }
.inline-note svg, .inline-note button, .permissions-summary strong { color: var(--brand-blue); }
.permissions-summary p { color: var(--brand-slate); }
.settings-profile p, .settings-tabs button, .account-settings-row label { color: var(--muted); }
.settings-tabs button.active, .detail-tabs button.active { color: var(--brand-blue); }
.settings-tabs button.active::after, .detail-tabs button.active::after { background: var(--brand-blue); }
.settings-tabs button > span, .detail-tabs button > span { background: var(--brand-soft); color: var(--brand-blue); }
.account-settings-row, .members-table td { border-color: #e7ecf5; }
.members-table th { background: var(--brand-ice); border-color: var(--brand-border); }
.members-table td, .members-table th { color: var(--brand-slate); }

/* Forms, drawers, and support surfaces use the same identity. */
input, textarea, select { background: #fff; border-color: #d4ddec; color: var(--brand-navy); border-radius: 4px; }
input::placeholder, textarea::placeholder { color: #7c879c; }
label, label small, .fine-print { color: var(--muted); }
.overlay { background: #0d1b3b80; }
.modal { border-color: var(--brand-border); border-top: 4px solid var(--brand-blue); border-radius: 6px; box-shadow: 0 30px 100px #12234935; }
.modal-heading h2 { color: var(--brand-navy); }
.modal-heading .eyebrow { color: var(--brand-blue); }
.modal-heading p:not(.eyebrow), .modal label, .modal label small, .modal-footer > span { color: var(--brand-slate); }
.modal input, .modal select, .modal textarea { color: var(--brand-navy); }
.required { color: var(--status-danger); }
.submitter, .submitter small { color: var(--brand-slate); }
.submitter svg, .submitter strong { color: var(--brand-blue); }
.detail-tabs button { color: var(--muted); }
.detail-description p:last-child, .detail-event p { color: var(--brand-slate); }
.detail-event strong, .detail-metadata strong { color: var(--brand-navy); }
.field-label, .detail-account, .detail-event small, .detail-metadata small { color: var(--muted); }
.detail-metadata { background: var(--brand-ice); }
.detail-metadata > span { color: var(--brand-blue); }
.form-divider { color: var(--muted); }
.form-divider::after { background: var(--brand-border); }
.event-icon { background: var(--brand-soft); color: var(--brand-blue); border-radius: 4px; }
.permission-list > div { border-color: #e7ecf5; color: var(--brand-blue); }
.permission-list strong, .channel-box strong { color: var(--brand-navy); }
.permission-list small, .channel-box small { color: var(--muted); }
.channel-box, .modal-footer, .detail-tabs, .note-form { border-color: var(--brand-border); }
.integration-warning { color: var(--status-warning); background: #faf5e9; border-color: #e8dbc1; }
.guide-step > span { background: var(--brand-soft); color: var(--brand-blue); border-radius: 4px; }
.guide-step h3 { color: var(--brand-navy); }
.guide-step p, .code-heading { color: var(--brand-slate); }
.contract-code { background: var(--brand-navy); color: #c6d6f3; border-radius: 4px; }
.toast { background: var(--brand-navy); color: #fff; border-left: 4px solid var(--brand-accent); border-radius: 4px; box-shadow: 0 8px 30px #12234924; }
.toast > button { color: #c5d5f2; }
.toast.error { background: #7d3434; color: #fff; border-left-color: #e5a5a5; }
.empty-icon { background: var(--brand-soft); color: var(--brand-blue); border-radius: 5px; }
.empty, .empty p { color: var(--muted); }
.empty h3 { color: var(--brand-slate); }
.mobile-scrim { background: #0d1b3b80; }

@media (max-width: 1100px) {
  .brand-logo-frame { min-height: 102px; padding: 12px 15px; }
  .brand-caption strong { font-size: 8px; letter-spacing: 1px; }
}
@media (max-width: 850px) {
  .brand-caption strong { font-size: 8px; letter-spacing: .7px; }
  .brand-caption span { font-size: 9px; }
  .brand-logo-frame { min-height: 96px; padding: 12px; }
}
@media (max-width: 680px) {
  .brand { padding: 0 0 23px; }
  .brand-logo-frame { min-height: 107px; padding: 12px 18px; }
  .brand-caption strong { font-size: 9px; letter-spacing: 1.15px; }
  .brand-caption span { font-size: 10px; }
  .mobile-close { position: absolute; top: -16px; right: -3px; background: var(--brand-navy); color: #fff; border: 1px solid #ffffff30; border-radius: 50%; width: 28px; height: 28px; }
  .mobile-menu { color: var(--brand-blue); }
  .page-heading > div:first-child { padding-left: 10px; }
  .mobile-project-search { border-color: var(--brand-border); color: var(--brand-blue); background: var(--brand-ice); }
  .mobile-project-search input { background: transparent; }
}
.source-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 17px;margin-bottom:20px;border:1px solid var(--brand-border);border-left:3px solid var(--brand-blue);background:#fff;border-radius:4px}
.source-bar>div:first-child{display:flex;align-items:center;gap:11px}.source-bar p{font-size:11px;color:var(--muted)}.source-bar strong{font-size:12px;color:var(--brand-navy)}.source-bar .source-links{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.source-links a{display:inline-flex;align-items:center;gap:6px;color:var(--brand-blue);font-size:11px;font-weight:600}.source-bar small{display:block;font-size:10px;color:var(--muted)}
.workflow-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--brand-border);border:1px solid var(--brand-border);border-radius:4px;overflow:hidden;margin:0 0 20px}.workflow-strip button{padding:12px 14px;background:#fff;text-align:left;display:flex;gap:10px;align-items:center}.workflow-strip button:hover{background:var(--brand-ice)}.workflow-strip strong{font-size:21px;color:var(--brand-blue);font-variant-numeric:tabular-nums;min-width:26px}.workflow-strip span{font-size:10px;color:var(--brand-slate);line-height:1.7}.workflow-strip .workflow-emphasis{background:var(--brand-soft)}
